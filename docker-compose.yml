services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: factoryvision
      POSTGRES_PASSWORD: factoryvision
      POSTGRES_DB: factoryvision
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U factoryvision"], interval: 5s, timeout: 3s, retries: 20}
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: factoryvision
      MINIO_ROOT_PASSWORD: change-me-in-production
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.1
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    ports: ["5000:5000"]
    volumes: [mlflowdata:/mlflow]
  api:
    build: {context: ., dockerfile: apps/api/Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg://factoryvision:factoryvision@postgres:5432/factoryvision
      SECRET_KEY: ${SECRET_KEY:-development-only-change-me}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    volumes: [./artifacts:/app/artifacts]
  web:
    build: {context: apps/web}
    environment: {NEXT_PUBLIC_API_URL: http://api:8000}
    ports: ["3000:3000"]
    depends_on: [api]
volumes: {pgdata: {}, miniodata: {}, mlflowdata: {}}
