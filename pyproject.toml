[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factoryvision-os"
version = "0.2.0"
description = "Industrial computer-vision, edge inference and quality operations platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "FactoryVision OS contributors"}]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.8",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "PyYAML>=6.0",
  "reportlab>=4.2",
  "python-multipart>=0.0.9",
  "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]
edge = ["onnx>=1.19", "skl2onnx>=1.19", "onnxruntime>=1.22", "openvino>=2026.0"]
mlops = ["mlflow>=2.15", "redis>=5.0", "boto3>=1.35"]

[project.scripts]
factoryvision = "factoryvision.cli:main"

[tool.setuptools.packages.find]
include = ["factoryvision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E401", "E402", "E701", "E702", "E712"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
